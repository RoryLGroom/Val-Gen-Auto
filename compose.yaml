name: val-gen-auto

services:
    
  postgres:
    image: postgres
    env_file: src/backend/.env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: 
      context: ./src/backend # build on backend folder into api container
      dockerfile: Dockerfile
    env_file: src/backend/.env.production # inject all prod variables into container environment
    environment: 
      VAL_SERVER_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    